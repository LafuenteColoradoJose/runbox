<h2 mat-dialog-title>Run Playbook</h2>
<mat-dialog-content>
  <p>Select an inventory to run this playbook. You can leave it blank if the playbook does not require an inventory or if it uses 'localhost'.</p>

  <mat-form-field appearance="outline" style="width: 100%; margin-top: 16px;">
    <mat-label>Inventory (Optional)</mat-label>
    <mat-select [ngModel]="selectedInventoryId()" (ngModelChange)="selectedInventoryId.set($event)">
      <mat-option [value]="null">-- No Inventory --</mat-option>
      @for (inv of inventories(); track inv.id) {
        <mat-option [value]="inv.id">{{ inv.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onRun()">Run</button>
</mat-dialog-actions>
