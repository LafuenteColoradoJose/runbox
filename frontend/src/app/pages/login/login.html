<div class="login-wrapper">
  <mat-card appearance="outlined" class="login-card">
    <mat-card-header class="login-header">
      <div class="logo-container" mat-card-avatar>
        <app-logo></app-logo>
      </div>
      <mat-card-title>Runbox</mat-card-title>
      <mat-card-subtitle>Inicia sesión para continuar</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        @if (errorMessage()) {
          <div class="error-message">
            <mat-icon color="warn">error_outline</mat-icon>
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input matInput formControlName="username" type="text" autocomplete="username" placeholder="ej: administrator">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput formControlName="password" type="password" autocomplete="current-password" placeholder="Tu contraseña">
        </mat-form-field>

        <div class="form-actions">
          <button mat-flat-button color="primary" type="submit" class="submit-btn" [disabled]="loginForm.invalid || loading()">
            @if (loading()) {
              <mat-icon class="spinner">refresh</mat-icon>
            }
            @if (loading()) {
              Iniciando...
            } @else {
              Entrar
            }
            @if (!loading()) {
              <mat-icon iconPositionEnd>arrow_forward</mat-icon>
            }
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
