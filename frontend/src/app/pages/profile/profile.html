<div class="profile-container">
  <div class="header">
    <h1>My Profile</h1>
    <p>Manage your personal information and security</p>
  </div>

  <div class="content-grid">
    <!-- User Info Card -->
    <mat-card class="info-card">
      <mat-card-header>
        <div mat-card-avatar class="avatar-placeholder">
          <mat-icon>person</mat-icon>
        </div>
        <mat-card-title>{{ currentUser()?.username }}</mat-card-title>
        <mat-card-subtitle>{{ currentUser()?.role === 'admin' ? 'Administrator' : 'User' }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p class="user-detail"><strong>User ID:</strong> {{ currentUser()?.id }}</p>
      </mat-card-content>
    </mat-card>

    <!-- Password Change Card -->
    <mat-card class="password-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>security</mat-icon>
        <mat-card-title>Change Password</mat-card-title>
        <mat-card-subtitle>Update your access key</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="password-form">
          <mat-form-field appearance="outline">
            <mat-label>Current Password</mat-label>
            <input matInput type="password" formControlName="currentPassword">
          </mat-form-field>
          
          <mat-form-field appearance="outline">
            <mat-label>New Password</mat-label>
            <input matInput type="password" formControlName="newPassword">
          </mat-form-field>
          
          <mat-form-field appearance="outline">
            <mat-label>Confirm New Password</mat-label>
            <input matInput type="password" formControlName="confirmPassword">
          </mat-form-field>
          
          <div class="form-actions">
            <button mat-flat-button color="primary" type="submit" [disabled]="passwordForm.invalid">
              Save Changes
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
