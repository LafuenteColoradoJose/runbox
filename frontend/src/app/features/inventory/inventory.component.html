<div class="inventory-main-container">
  <div class="inventory-header">
    <h1>Inventories</h1>
    <div class="header-actions">
      <app-search-bar [(searchQuery)]="searchQuery"></app-search-bar>
      @if (authService.currentUser()?.role === 'admin') {
        <button mat-fab extended color="primary" (click)="openDialog()">
          <mat-icon>add</mat-icon> Add Inventory
        </button>
      }
    </div>
  </div>

  <div class="table-container mat-elevation-z1">
    <table mat-table [dataSource]="pagedInventories()" matSort (matSortChange)="onSortData($event)">
      
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let element" class="font-medium"> 
          <a [routerLink]="['/inventory', element.id]" class="primary-link">{{element.name}}</a>
        </td>
      </ng-container>

      <ng-container matColumnDef="organization">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Organization </th>
        <td mat-cell *matCellDef="let element">
          @if (element.organization_name) {
            <a class="status-badge org-chip" routerLink="/organizations" style="cursor: pointer; text-decoration: none;" title="Go to Organizations">
              <mat-icon style="font-size: 14px; width: 14px; height: 14px; margin-right: 4px;">business</mat-icon>
              {{element.organization_name}}
            </a>
          } @else {
            <span class="text-gray-400 text-sm italic">None</span>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="text-right"> Actions </th>
        <td mat-cell *matCellDef="let element" class="text-right">
          @if (authService.currentUser()?.role === 'admin') {
            <button mat-icon-button color="primary" (click)="openDialog(element)" title="Edit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteInv(element.id)" title="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns();" class="table-row"></tr>
      
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-state" [attr.colspan]="displayedColumns().length">
          No inventories found.
        </td>
      </tr>
    </table>
    
    <mat-paginator 
      [length]="filteredInventories().length"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 25, 100]"
      (page)="onPageChange($event)"
      aria-label="Select page of inventories">
    </mat-paginator>
  </div>
</div>
