<mat-card class="playbook-card" [class.list-mode]="viewMode() === 'list'" appearance="outlined">
  
  <div class="card-main">
    <mat-icon class="playbook-icon">integration_instructions</mat-icon>
    <div class="playbook-title">{{ playbook().name }}</div>
  </div>

  <div class="card-meta">
    @if (playbook().source_type === 'database') {
      <span class="badge source-badge" matTooltip="Saved in Database">
        <mat-icon inline>storage</mat-icon> Database
      </span>
    } @else if (playbook().source_type === 'git') {
      <span class="badge source-badge" [matTooltip]="playbook().git_repo_url || ''">
        <mat-icon inline>account_tree</mat-icon> Git Repo
      </span>
    } @else {
      <span class="badge source-badge" [matTooltip]="playbook().path || ''">
        <mat-icon inline>folder</mat-icon> Local Path
      </span>
    }

    @for (tag of playbook().tags; track tag) {
      <span class="badge tag-badge">{{ tag }}</span>
    }
  </div>

  <div class="spacer"></div>

  <div class="card-actions">
    @if (isAdmin()) {
      <button mat-icon-button color="primary" (click)="onEdit.emit(playbook())" matTooltip="Edit">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="onDelete.emit(playbook())" matTooltip="Delete">
        <mat-icon>delete</mat-icon>
      </button>
    }
    <button mat-icon-button class="run-btn" color="primary" (click)="onRun.emit(playbook())" matTooltip="Run">
      <mat-icon>play_circle</mat-icon>
    </button>
  </div>
</mat-card>
