<div class="inventory-main-container">
  <div class="inventory-header">
    <h1>Inventories</h1>
    <button mat-flat-button color="primary" (click)="openDialog()">
      <mat-icon>add</mat-icon> Add Inventory
    </button>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="inventories">
      
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element" class="font-medium"> 
          <a [routerLink]="['/inventory', element.id]" class="primary-link">{{element.name}}</a>
        </td>
      </ng-container>

      <ng-container matColumnDef="organization">
        <th mat-header-cell *matHeaderCellDef> Organization </th>
        <td mat-cell *matCellDef="let element">
          @if (element.organization_name) {
            <mat-chip-set>
              <mat-chip class="org-chip" routerLink="/organizations" style="cursor: pointer;" title="Go to Organizations">
                <mat-icon matChipAvatar>business</mat-icon>
                {{element.organization_name}}
              </mat-chip>
            </mat-chip-set>
          } @else {
            <span class="text-gray-400 text-sm italic">None</span>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="text-right"> Actions </th>
        <td mat-cell *matCellDef="let element" class="text-right">
          <button mat-icon-button color="primary" (click)="openDialog(element)" title="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button style="color: red;" (click)="deleteInv(element.id)" title="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row"></tr>
    </table>
    
    @if (inventories.length === 0) {
      <div class="empty-state">
        No inventories found. Click "Add Inventory" to create one.
      </div>
    }
  </div>
</div>
