<div class="org-main-container">
  <div class="org-header">
    <h1>Organizations</h1>
    <div class="header-actions">
      <app-search-bar [(searchQuery)]="searchQuery"></app-search-bar>
      @if (authService.currentUser()?.role === 'admin') {
        <button mat-fab extended color="primary" (click)="openDialog()">
          <mat-icon>add</mat-icon> Add Organization
        </button>
      }
    </div>
  </div>

  <div class="table-container mat-elevation-z1">
    <table mat-table [dataSource]="pagedOrganizations()" matSort (matSortChange)="onSortData($event)">
      
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let element" class="font-medium"> {{element.name}} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="text-right"> Actions </th>
        <td mat-cell *matCellDef="let element" class="text-right">
          @if (authService.currentUser()?.role === 'admin') {
            <button mat-icon-button color="primary" (click)="openDialog(element)" title="Edit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteOrg(element.id)" title="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns();" class="table-row"></tr>
      
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-state" [attr.colspan]="displayedColumns().length">
          No organizations found.
        </td>
      </tr>
    </table>
    
    <mat-paginator 
      [length]="filteredOrganizations().length"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 25, 100]"
      (page)="onPageChange($event)"
      aria-label="Select page of organizations">
    </mat-paginator>
  </div>
</div>
