<div class="page-header">
  <div class="header-content">
    <h1>Playbooks</h1>
    <p>Manage and execute your Ansible playbooks</p>
  </div>
  <div class="header-actions">
    <app-search-bar [(searchQuery)]="searchQuery" placeholder="Search playbooks..."></app-search-bar>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="tag-filter">
      <mat-label>Categoría</mat-label>
      <mat-select [value]="selectedTag()" (selectionChange)="selectedTag.set($event.value)">
        <mat-option value="">Todas</mat-option>
        @for (tag of availableTags(); track tag) {
          <mat-option [value]="tag">{{ tag }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <div class="view-toggle">
      <button mat-icon-button (click)="viewMode.set('grid')" [color]="viewMode() === 'grid' ? 'primary' : ''" matTooltip="Vista cuadrícula">
        <mat-icon>grid_view</mat-icon>
      </button>
      <button mat-icon-button (click)="viewMode.set('list')" [color]="viewMode() === 'list' ? 'primary' : ''" matTooltip="Vista lista">
        <mat-icon>view_list</mat-icon>
      </button>
    </div>
    @if (isAdmin()) {
      <button mat-fab extended color="primary" class="add-btn" (click)="openDialog()">
        <mat-icon>add</mat-icon> Añadir Playbook
      </button>
    }
  </div>
</div>

@if (loading()) {
  <div class="loading-state">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
} @else {
  <div [class]="'playbooks-container ' + viewMode()">
    @for (playbook of pagedPlaybooks(); track playbook.id) {
      <app-playbook-card 
        [playbook]="playbook" 
        [isAdmin]="isAdmin()"
        [viewMode]="viewMode()"
        (onRun)="runPlaybook($event)"
        (onEdit)="openDialog($event)"
        (onDelete)="deletePlaybook($event)">
      </app-playbook-card>
    } @empty {
      <div class="empty-state">
        <p>No playbooks found. Create one in the database.</p>
      </div>
    }
  </div>
  
  <mat-paginator 
    [length]="filteredPlaybooks().length"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[10, 25, 50, 100]"
    (page)="onPageChange($event)"
    showFirstLastButtons>
  </mat-paginator>
}
