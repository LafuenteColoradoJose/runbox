<div class="page-header">
  <div class="header-content">
    <h1>Playbooks</h1>
    <p>Manage and execute your Ansible playbooks</p>
  </div>
  @if (isAdmin()) {
    <button mat-fab extended color="primary" class="add-btn" (click)="openDialog()">
      <mat-icon>add</mat-icon> Añadir Playbook
    </button>
  }
</div>

@if (loading()) {
  <div class="loading-state">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
} @else {
  <div class="playbooks-grid">
    @for (playbook of pagedPlaybooks(); track playbook.id) {
      <app-playbook-card 
        [playbook]="playbook" 
        [isAdmin]="isAdmin()"
        (onRun)="runPlaybook($event)"
        (onEdit)="openDialog($event)"
        (onDelete)="deletePlaybook($event)">
      </app-playbook-card>
    } @empty {
      <div class="empty-state">
        <p>No playbooks found. Create one in the database.</p>
      </div>
    }
  </div>
  
  <mat-paginator 
    [length]="playbooks().length"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[10, 25, 50, 100]"
    (page)="onPageChange($event)"
    showFirstLastButtons>
  </mat-paginator>
}
